{% if doc.is_active %}
	<div class="doctor-grid">
		<div class="doctor-card">
			<h3>{{ doc.doctor_name }}</h3>

			{% for sp in doc.speciality %}
				<p class="specialization"><strong>{{ sp.degree }}</strong> in {{ sp.speciality }}<br><small>from {{ sp.institution }}</small></p>
			{% endfor %}

			<div class="timing-block">
				<p class="timing-label">Available Timings:</p>
				{% for opd in doc.opd_timings %}
					<span class="badge">{{ opd.time_slot }}</span>
				{% endfor %}
			</div>

			<div class="button-group">
				<a href="/{{ doc.route }}" class="btn">View Profile</a>
				<a href="/book-appointment/new/?doctor={{doc.name}}" class="btn btn-secondary">Book Appointment</a>
			</div>
		</div>
	</div>
{% endif %}

<style>
  body {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background: #f8f9fa;
  }

  .doctor-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 16px;
  }

  .doctor-card {
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    text-align: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .doctor-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.1);
  }

  .doctor-card h3 {
    margin-bottom: 12px;
    font-size: 1.4rem;
    color: #333;
  }

  .specialization {
    font-size: 0.95rem;
    color: #555;
    margin-bottom: 8px;
  }

  .timing-block {
    margin-top: 12px;
  }

  .timing-label {
    font-weight: bold;
    color: #444;
    margin-bottom: 6px;
  }

  .badge {
    display: inline-block;
    background: #e7f3ff;
    color: #007bff;
    padding: 6px 10px;
    border-radius: 12px;
    font-size: 0.85rem;
    margin: 2px 4px;
  }

  .button-group {
    margin-top: 20px;
  }

  .btn {
    display: inline-block;
    padding: 10px 16px;
    margin: 4px;
    background-color: #007bff;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 500;
    transition: background 0.2s;
  }

  .btn:hover {
    background-color: #0056b3;
  }

  .btn-secondary {
    background-color: #6c757d;
  }

  .btn-secondary:hover {
    background-color: #495057;
  }
</style>
